<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playlist — PodcastApp</title>
  <meta name="description" content="Les playlists collaboratives se consultent et se modifient dans PodcastApp." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/deeplink.css" />

<body data-section="playlist">

      <a class="btn primary" id="open" href="podcastapp://playlist">Ouvrir dans PodcastApp</a>
      <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.jacquesmontahut.podcast.audio">Installer depuis Google Play</a>
    </div>
    <footer>
      <a href="../">PodcastApp</a> · <a href="https://zeptoniator.github.io">Toutes les applications</a>
    </footer>
  </main>
  <script src="../assets/deeplink.js"></script>
